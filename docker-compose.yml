services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sanvad
      POSTGRES_PASSWORD: sanvad
      POSTGRES_DB: sanvad
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanvad"]
      interval: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sanvad:sanvad@db:5432/sanvad
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data:ro
      - ./static:/srv/static:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: