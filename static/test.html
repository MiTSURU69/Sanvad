<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sanvad widget demo</title></head>
<body style="font-family:sans-serif;padding:40px">
  <h1>Sanvad demo</h1>
  <p>Pick a business. The chat bubble at the bottom right will answer for that tenant only.</p>
  <select id="pick" style="font-size:16px;padding:6px">
    <option value="shop_001">ShopEasy (ecommerce)</option>
    <option value="clinic_001">SmileCare Clinic (healthcare)</option>
    <option value="edu_001">LearnLoop (edtech)</option>
  </select>

  <script>
    var names = { shop_001: "ShopEasy Support", clinic_001: "SmileCare Clinic", edu_001: "LearnLoop Help" };
    var params = new URLSearchParams(location.search);
    var tenant = names[params.get("tenant")] ? params.get("tenant") : "shop_001";

    document.getElementById("pick").value = tenant;
    document.getElementById("pick").onchange = function () {
      location.search = "?tenant=" + this.value;
    };

    var s = document.createElement("script");
    s.src = "/static/widget.js";
    s.setAttribute("data-tenant", tenant);
    s.setAttribute("data-title", names[tenant]);
    document.body.appendChild(s);
  </script>
</body>
</html>
